plugins {
    id 'com.android.application'
}

def appVersionCode = 174
def appVersionName = String.format(
        Locale.ROOT,
        "%d.%02d",
        appVersionCode.intdiv(100),
        appVersionCode % 100)

// Release signing is supplied at publish time so secrets never live in source control.
def releaseKeystorePath = providers.environmentVariable("CF_KEYSTORE_PATH")
        .orElse("C:/app/build_apk/keystore").get()
def releaseStorePassword = providers.environmentVariable("CF_STORE_PASSWORD").orNull
def releaseKeyAlias = providers.environmentVariable("CF_KEY_ALIAS").orNull
def releaseKeyPassword = providers.environmentVariable("CF_KEY_PASSWORD").orNull
def releaseSigningConfigured = rootProject.file(releaseKeystorePath).isFile()
        && releaseStorePassword
        && releaseKeyAlias
        && releaseKeyPassword

// Package app/id_rsa.pem into the APK at build time. Override with
// -PembeddedSshKeyFile=<path> when a different key file is needed.
def embeddedSshKeyPath = providers.gradleProperty("embeddedSshKeyFile")
        .orElse(layout.projectDirectory.file("id_rsa.pem").asFile.absolutePath)
def embeddedSshKeyFile = embeddedSshKeyPath.map { rootProject.file(it) }
def generatedSshKeyAssetsDir = layout.buildDirectory.dir("generated/sshKeyAssets")

tasks.register("prepareEmbeddedSshKey", Sync) {
    from(embeddedSshKeyFile)
    into(generatedSshKeyAssetsDir)
    rename { "id_rsa.pem" }

    doFirst {
        File keyFile = embeddedSshKeyFile.get()
        if (!keyFile.isFile()) {
            throw new GradleException(
                    "Embedded SSH key not found: ${keyFile}. " +
                            "Set -PembeddedSshKeyFile=<path> to override it.")
        }
    }
}

android {
    namespace = 'com.commafinder'
    compileSdk = 37

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile = rootProject.file(releaseKeystorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId = "com.commafinder"
        minSdk = 29
        targetSdk = 37
        versionCode = appVersionCode
        versionName = appVersionName
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDir(generatedSshKeyAssetsDir)
    }

}

tasks.named("preBuild").configure {
    dependsOn("prepareEmbeddedSshKey")
}

tasks.register("printAppVersionName") {
    doLast {
        println(appVersionName)
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("comma_finder_v${appVersionName}.apk")
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'

    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'com.google.code.gson:gson:2.15.0'
    testImplementation 'junit:junit:4.13.2'
}
